launcher:
  backend: local
  model_path: Qwen/Qwen3-Omni-30B-A3B-Instruct
  model_name: qwen3-omni
  num_workers: 2
  num_gpus_per_worker: 1
  worker_host: 127.0.0.1
  worker_base_port: 8011
  # The single-H20 colocated profile: the speech-colocated topology plus the
  # per-stage memory budgets calibrated for one H20 (about 6% of device
  # memory stays outside stage budgets for graph capture and workspaces).
  worker_extra_args: >-
    --variant speech-colocated --name qwen3-omni-colocated-h20
    --image_encoder.gpu_memory_fraction 0.025 --audio_encoder.gpu_memory_fraction 0.025
    --thinker.gpu_memory_fraction 0.75 --talker_ar.gpu_memory_fraction 0.12
    --code2wav.gpu_memory_fraction 0.02
  wait_timeout: 600
